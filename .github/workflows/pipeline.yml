name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker Image
      # On tague l'image avec votre nom d'utilisateur Docker Hub
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mon-app:latest .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/mon-app:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # --- NOUVELLES ÉTAPES POUR DOCKER HUB ---

    - name: Log in to Docker Hub
      if: success() 
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker Image
      if: success() 
      run: docker push ${{ secrets.DOCKER_USERNAME }}/mon-app:latest